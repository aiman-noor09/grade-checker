<script>
    
let marks = +prompt("Enter your marks percentage");

if (marks >= 90) {
    console.log("A1🎊");
}
else if (marks >= 80) {
    console.log("A🎉");
}
else if (marks >= 70) {
    console.log("B✨");
}
else if (marks >= 50) {
    console.log("C💫");
}
else {
    console.log("D😔");
}
</script>
